name: CI

# Checks for the main branch only: pull requests that target main, and pushes to main
# (cd.yml calls this file, so main is checked once per push and then published).
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only supersede stale PR runs; never cancel a run that gates a main deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (build, test, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TaskManager.sln

      - name: Build
        run: dotnet build TaskManager.sln -c Release --no-restore

      - name: Test
        run: dotnet test TaskManager.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Fail if the model changed without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/TaskManager.Api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/tests/**/TestResults/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npx ng build --configuration production

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render kustomization
        run: kubectl kustomize k8s > rendered.yaml

      - name: Validate against the Kubernetes schemas
        run: docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary - < rendered.yaml

  docker-images:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait until the API is ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4200/health/ready; then
              echo; echo "ready after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in 120s"; exit 1

      - name: Login and call a protected endpoint through nginx
        run: |
          set -euo pipefail
          source .env

          anon=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/api/tasks)
          [ "$anon" = "401" ] || { echo "expected 401 without a token, got $anon"; exit 1; }

          token=$(curl -fsS -X POST http://localhost:4200/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$DEMO_USER_EMAIL\",\"password\":\"$DEMO_USER_PASSWORD\"}" | jq -er .token)

          authed=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/api/tasks \
            -H "Authorization: Bearer $token")
          [ "$authed" = "200" ] || { echo "expected 200 with a token, got $authed"; exit 1; }

      - name: Serve the SPA
        run: curl -fsS http://localhost:4200/ | grep -qi '<app-root'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
