# DEV PLACEHOLDERS so `kubectl apply -k k8s/` works out of the box for reviewers.
# Never reuse these values. For a real cluster replace them before applying, e.g.:
#   kubectl -n taskflow create secret generic taskflow-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=JWT_KEY="$(openssl rand -base64 48)" \
#     --from-literal=DEMO_USER_PASSWORD='...' --dry-run=client -o yaml | kubectl apply -f -
# (or use Sealed Secrets / External Secrets so nothing sensitive is committed).
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: dev-only-change-me-db-password
  JWT_KEY: dev-only-change-me-jwt-signing-key-min-32-chars
  DEMO_USER_PASSWORD: Admin@123
