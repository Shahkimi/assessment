# Per-colour Service (frontend-blue / frontend-green): lets you test the idle colour before it goes live.
# Live traffic uses the separate `frontend` Service in k8s/services.yaml.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: taskflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
