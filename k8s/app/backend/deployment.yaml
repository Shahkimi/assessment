# Base template for one blue/green colour of the API. k8s/slots/<colour> adds the name suffix and the
# `slot` label; do not apply this directory directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: taskflow
spec:
  # No `replicas`: the HorizontalPodAutoscaler (hpa.yaml) owns the replica count. Migrations run in
  # the pre-deploy Job (k8s/jobs/migrate.yaml), so any number of pods and both colours are safe.
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: taskflow
    spec:
      # Time for in-flight requests to finish after the preStop sleep when HPA scales down.
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: taskflow-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # These three are defined first because the connection string below refers to them
            # with $(NAME); Kubernetes only expands variables declared earlier in the list.
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__Default
              value: Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: JWT_KEY
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: JWT_AUDIENCE
            - name: Jwt__ExpiryMinutes
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: JWT_EXPIRY_MINUTES
            - name: DemoUser__Email
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: DEMO_USER_EMAIL
            - name: DemoUser__Password
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: DEMO_USER_PASSWORD
            # Off: the migration Job applies the schema before a new colour is rolled out.
            - name: Database__ApplyMigrationsOnStartup
              value: "false"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Gives the app time to start before liveness can kill it.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 30
          # Liveness: process answers (does not touch the DB, so a DB blip never restarts the API).
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: DB reachable. Not ready = removed from the Service, not restarted.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # The CPU request is the HPA's 100 % reference (utilization target in hpa.yaml).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
