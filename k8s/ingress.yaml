# Bonus: single entry point. Needs an ingress controller (e.g. ingress-nginx).
#   everything -> the live `frontend` Service (blue or green, see k8s/services.yaml).
# The frontend's nginx proxies /api, /swagger and /health to the same colour's backend, so one selector
# change in scripts/bluegreen.sh switches the whole release at once.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
